<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- 让手机端页面正常缩放 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">

    <link th:href="@{/css/site.css}" rel="stylesheet">

    <title th:text="#{login.title}">Admin sign in</title>
</head>

<body class="bg-dark bg-gradient">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="row w-100 justify-content-center">

        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <!-- 标题 -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" th:text="#{login.title}">Admin sign in</h2>
                        <p class="text-muted mb-0">
                            <span th:text="#{login.subtitle}">Sign in to manage your blog</span>
                        </p>
                    </div>

                    <!-- 登录表单 -->
                    <form id="login-form" class="needs-validation" th:action="@{/login}" method="post" novalidate
                          th:data-generic-error="#{common.tryAgain}" th:data-submitting="#{login.submitting}"
                          th:data-submit-label="#{login.submit}" th:data-show-password="#{login.showPassword}" th:data-hide-password="#{login.hidePassword}">

                        <!-- Username -->
                        <div class="mb-3">
                            <label
                                for="username"
                                class="form-label">
                                <span th:text="#{login.account}">Account</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                th:placeholder="#{login.accountPlaceholder}"
                                autocomplete="username"
                                required
                                autofocus>
                            <div class="invalid-feedback" th:text="#{login.accountInvalid}">Enter your account.</div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label
                                for="password"
                                class="form-label">
                                <span th:text="#{login.password}">Password</span>
                            </label>

                            <div class="position-relative password-field">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    th:placeholder="#{login.passwordPlaceholder}"
                                    autocomplete="current-password"
                                    required>
                                <button id="toggle-password" class="btn btn-link position-absolute border-0 p-2 password-toggle" type="button" th:attr="aria-label=#{login.showPassword}" aria-pressed="false">
                                    <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                                    </svg>
                                    <svg id="eye-closed" class="d-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                        <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474L2.771 4.892C1.343 6.14.615 7.506.615 7.506a1 1 0 0 0 0 .988S3.41 13.5 8 13.5a7.7 7.7 0 0 0 2.79-.588M5.21 3.088A7.7 7.7 0 0 1 8 2.5c4.59 0 7.385 5.006 7.385 5.006a1 1 0 0 1 0 .988s-.728 1.367-2.156 2.615l-1.931-1.931a3.5 3.5 0 0 0-4.474-4.474z"/>
                                        <path d="M13.646 14.354 1.646 2.354l.708-.708 12 12z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="invalid-feedback" th:text="#{login.passwordInvalid}">Enter your password.</div>
                        </div>
                        <div id="login-message"
                             class="alert alert-danger"
                             th:classappend="${loginError == null} ? 'd-none'"
                             th:text="${loginError}"
                             role="alert"
                             aria-live="polite"></div>
                        <!-- Login button -->
                        <button
                            id="login-submit"
                            type="submit"
                            class="btn btn-primary w-100">
                            <span th:text="#{login.submit}">Sign in</span>
                        </button>

                    </form>

                    <div class="btn-group btn-group-sm d-flex mt-4" th:attr="aria-label=#{nav.language}">
                        <a class="btn btn-outline-secondary" th:classappend="${#locale.language == 'en'} ? 'active'" href="?lang=en">English</a>
                        <a class="btn btn-outline-secondary" th:classappend="${#locale.language == 'zh'} ? 'active'" href="?lang=zh_CN">中文</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
